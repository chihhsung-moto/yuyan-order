.tab.active { color: #8b4513; border-bottom-color: #8b4513; }

.section { display: none; padding: 12px; }
.section.active { display: block; }

.category-label { font-size: 11px; font-weight: 700; color: #8b4513; letter-spacing: 2px; text-transform: uppercase; margin: 12px 0 6px; padding-left: 4px; }

.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 14px; font-weight: 600; }
.item-name .star { color: #e67e22; font-size: 12px; }

.item-sub { font-size: 11px; color: #999; margin-top: 2px; }
.item-price { font-size: 13px; color: #8b4513; font-weight: 700; white-space: nowrap; }
.qty-control { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.qty-btn:active { background: #f0e8dc; }
.qty-num { min-width: 22px; text-align: center; font-size: 15px; font-weight: 700; }

.sticky-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 200; box-shadow: 0 -4px 12px rgba(0,0,0,.2); }

.total-label { font-size: 11px; color: #aaa; }
.total-amount { font-size: 18px; font-weight: 800; color: #f0c060; }

.copy-btn { background: #8b4513; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }

.toast.show { opacity: 1; }

.bottom-space { height: 80px; }

// State
const orders = {}; // key: itemId, value: { name, price, qty }

function getItemId(tabIdx, catIdx, itemIdx) {
  return `${tabIdx}-${catIdx}-${itemIdx}`;
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  const sectionsEl = document.getElementById('sections');
  MENU.forEach((section, ti) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (ti === 0 ? ' active' : '');
    tab.textContent = section.tab;
    tab.onclick = () => switchTab(ti);
    tabsEl.appendChild(tab);

    const sec = document.createElement('div');
    sec.className = 'section' + (ti === 0 ? ' active' : '');
    sec.id = `sec-${ti}`;

    if (section.categories) {
      section.categories.forEach((cat, ci) => {
        const lbl = document.createElement('div');
        lbl.className = 'category-label';
        lbl.textContent = cat.label;
        sec.appendChild(lbl);
        cat.items.forEach((item, ii) => {
          sec.appendChild(makeItemEl(item, getItemId(ti, ci, ii)));
        });
      });
    } else {
      section.items.forEach((item, ii) => {
        sec.appendChild(makeItemEl(item, getItemId(ti, 0, ii)));
      });
    }

    sectionsEl.appendChild(sec);
  });
}

function switchTab(ti) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === ti));
  document.querySelectorAll('.section').forEach((s, i) => s.classList.toggle('active', i === ti));
}

function makeItemEl(item, id) {
  const div = document.createElement('div');
  div.className = 'item';
  div.id = `item-${id}`;

  const isJun = item.price === '旬價';
  const priceDisplay = isJun ? '旬價' : (typeof item.price === 'string' ? `$${item.price}` : `$${item.price}`);

  div.innerHTML = `
    <div class="item-info">
      <div class="item-name">${item.name}</div>
      ${item.sub ? `<div class="item-sub">${item.sub}</div>` : ''}
    </div>
    <div class="item-price">${priceDisplay}</div>
    ${!isJun ? `
    <div class="qty-control">
      <button class="qty-btn" onclick="changeQty('${id}', -1)">−</button>
      <div class="qty-num" id="qty-${id}">0</div>
      <button class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
    </div>` : `<div style="font-size:11px;color:#999">現場點</div>`}
  `;
  return div;
}

function changeQty(id, delta) {
  const parts = id.split('-');
  const ti = +parts[0], ci = +parts[1], ii = +parts[2];
  const section = MENU[ti];
  const item = section.categories ? section.categories[ci].items[ii] : section.items[ii];

  if (!orders[id]) orders[id] = { name: item.name, price: item.price, qty: 0 };
  orders[id].qty = Math.max(0, orders[id].qty + delta);

  const qtyEl = document.getElementById(`qty-${id}`);
  if (qtyEl) qtyEl.textContent = orders[id].qty;

  // Highlight
  const itemEl = document.getElementById(`item-${id}`);
  if (itemEl) itemEl.style.background = orders[id].qty > 0 ? '#fff8f0' : '#fff';

  updateTotal();
}

function updateTotal() {
  let total = 0, count = 0;
  for (const [id, o] of Object.entries(orders)) {
    if (o.qty > 0 && typeof o.price === 'number') {
      total += o.price * o.qty;
      count += o.qty;
    }
  }
  document.getElementById('totalAmt').textContent = `$${total.toLocaleString()}`;
  document.getElementById('totalItems').textContent = count > 0 ? `共 ${count} 項` : '尚未選擇任何餐點';
}

function copyOrder() {
  const name = document.getElementById('nameInput').value.trim() || '（未填姓名）';
  const lines = [`🐟【${name} 的點餐】魚煙居酒屋 9/5 晚餐`, ''];

  const grouped = {};
  for (const [id, o] of Object.entries(orders)) {
    if (o.qty <= 0) continue;
    const ti = +id.split('-')[0];
    const tab = MENU[ti].tab;
    if (!grouped[tab]) grouped[tab] = [];
    const price = typeof o.price === 'number' ? `$${o.price}×${o.qty}＝$${o.price * o.qty}` : o.price;
    grouped[tab].push(`  • ${o.name}（${o.qty}份）${price}`);
  }

  if (Object.keys(grouped).length === 0) {
    alert('請先選擇餐點再複製！');
    return;
  }

  for (const [tab, items] of Object.entries(grouped)) {
    lines.push(`【${tab}】`);
    items.forEach(i => lines.push(i));
    lines.push('');
  }

  // Total
  let total = 0;
  for (const o of Object.values(orders)) {
    if (o.qty > 0 && typeof o.price === 'number') total += o.price * o.qty;
  }
  lines.push(`💰 小計：$${total.toLocaleString()}`);
  lines.push('（旬價/雙份價格請現場確認）');

  const text = lines.join('\n');

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(showToast);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  }
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

renderTabs();
</script>
